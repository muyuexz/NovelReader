name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # 诊断：把最终 APK 的签名证书指纹打出来，便于跨 run 核对签名是否恒定。
      # 固定签名由 app/build.gradle.kts 的 signingConfigs.ciFixed 显式指向 ci/debug.keystore。
      - name: Verify APK signing certificate
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK = $APK"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1)
          echo "apksigner = $APKSIGNER"
          if [ -n "$APKSIGNER" ]; then "$APKSIGNER" verify --print-certs "$APK"; fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NovelReader-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 把 APK 塞回仓库（走 codeload 通道下载），并顺手上传一份到 0x0.st 备用
      - name: Publish APK back to repo
        if: always()
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/NovelReader-debug.apk
          ls -lh dist/ || true
          URL=$(curl -sS -F "file=@app/build/outputs/apk/debug/app-debug.apk" https://0x0.st || true)
          echo "0x0.st -> $URL"
          echo "$URL" > dist/url.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/
          git commit -m "build: NovelReader-debug.apk [skip ci]" || true
          git push || true
