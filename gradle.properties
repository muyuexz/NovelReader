# Project-wide Gradle settings.

# JVM arguments for the Gradle daemon.
# 2026-09-19 编译提速：runner 有 7G 内存，2G 偏保守；提到 3G 让 Kotlin/Compose 编译更顺。
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError

# Build performance.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# AndroidX is required by all Jetpack libraries.
android.useAndroidX=true

# Kotlin code style.
kotlin.code.style=official
# 2026-09-19 编译提速：显式开启 Kotlin 增量编译（CI 冷启动收益有限，本地/重复构建有益）。
kotlin.incremental=true

# Enable non-transitive R classes for smaller, faster builds.
android.nonTransitiveRClass=true

# Enable Jetifier only if legacy support libs are needed (off by default here).
android.enableJetifier=false
