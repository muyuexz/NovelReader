# Project-wide Gradle settings.

# JVM arguments for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError

# Build performance.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# AndroidX is required by all Jetpack libraries.
android.useAndroidX=true

# Kotlin code style.
kotlin.code.style=official

# Enable non-transitive R classes for smaller, faster builds.
android.nonTransitiveRClass=true

# Enable Jetifier only if legacy support libs are needed (off by default here).
android.enableJetifier=false
